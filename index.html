async function sb(path, { method = "GET", body, prefer } = {}) {
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
  };
  if (prefer) headers["Prefer"] = prefer;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase ${method} ${path} failed: ${res.status} ${text}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------- Supabase Auth (real e-mail + password login, with password recovery e-mails) ----------
async function authSignIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const body = await res.json().catch(() => null);
  return { ok: res.ok, status: res.status, accessToken: body && body.access_token };
}

async function authSignUp(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  return { ok: res.ok, status: res.status };
}

async function authRecover(email) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },

}

function safeLocalGet(key) {

function safeLocalSet(key, value) {

}
function safeLocalRemove(key) {
  try {
    window.localStorage.removeItem(key);
  } catch {

  }
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "agora mesmo";
  if (diff < 3600) return `há ${Math.max(1, Math.floor(diff / 60))} min`;
  if (diff < 86400) return `há ${Math.floor(diff / 3600)} horas`;
  return `há ${Math.floor(diff / 86400)} dias`;
}

function compressImage(file, maxSize = 320, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function hashPassword(pw) {
  const text = "comunidade-oracao-salt:" + pw;
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder().encode(text);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch {
      /* fall through to the simple fallback below */
    }
  }
  // Fallback for contexts without SubtleCrypto (e.g. testing via a local file:// page).
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    hash = (hash << 5) - hash + text.charCodeAt(i);
    hash |= 0;
  }
  return "fb_" + Math.abs(hash).toString(16);
}

  async function completeOnboarding(name, email, password, photo) {
    const cleanEmail = email.trim().toLowerCase();
    try {
      // Recognize returning members by e-mail, even from a different app/browser
      // (Instagram, WhatsApp, Safari, etc. each have their own separate storage).
      const existing = await sb(`users?email=eq.${encodeURIComponent(cleanEmail)}&select=*&limit=1`);
      const profile = existing && existing[0];

      if (profile && profile.is_blocked) {
        setIAmBlocked(true);
        return true;
      }

      // Try the real Supabase Auth sign-in first.
      const signIn = await authSignIn(cleanEmail, password);
      if (signIn.ok) {
        setMyAccessToken(signIn.accessToken || null);
        if (profile) {
          await logInAsProfile(profile);
          showToast(`Bem-vindo(a) de volta, ${profile.name}!`);
        } else {
          // Has an Auth account but no profile yet (shouldn't normally happen) — create one.
          const rows = await sb("users", {
            method: "POST",
            body: { name, email: cleanEmail, auth_migrated: true, photo_url: photo },
            prefer: "return=representation",
          });
          await logInAsProfile(rows[0]);
        }
        return true;
      }

      // Sign-in failed. If this profile already has a real Auth account, the password was wrong.
      if (profile && profile.auth_migrated) {
        return false; // Onboarding shows "senha incorreta"
      }

      // Either a brand new person, or a legacy profile made before real auth existed —
      // in both cases, register this password as their Auth account now.
      const signUp = await authSignUp(cleanEmail, password);
      if (!signUp.ok) {
        showToast("Não consegui te cadastrar agora. Tente novamente.");
        return true;
      }

      if (profile) {
        await sb(`users?id=eq.${profile.id}`, { method: "PATCH", body: { auth_migrated: true } });
        await logInAsProfile({ ...profile, auth_migrated: true });
        showToast(`Bem-vindo(a) de volta, ${profile.name}!`);
        return true;
      }

      const rows = await sb("users", {
        method: "POST",
        body: { name, email: cleanEmail, auth_migrated: true, photo_url: photo },
        prefer: "return=representation",
      });
      await logInAsProfile(rows[0]);
      return true;
    } catch (e) {
      showToast("Não consegui te cadastrar agora. Tente novamente.");
      return true;
    }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  async function bumpStreak() {
    const today = todayStr();
    if (myStreak.lastDate === today) return; // already counted today
    let nextCount = 1;
    if (myStreak.lastDate && daysBetween(myStreak.lastDate, today) === 1) {
      nextCount = myStreak.count + 1;
    }
    const next = { count: nextCount, lastDate: today, freezeUsedMonth: myStreak.freezeUsedMonth };
    setMyStreak(next);
    try {
      await sb(`users?id=eq.${myId}`, {
        method: "PATCH",
        body: { streak_count: nextCount, streak_last_date: today },
      });
    } catch {
      /* non-critical, next poll reconciles */
    }
  }

  async function useFreeze() {
    const month = todayStr().slice(0, 7);
    if (myStreak.freezeUsedMonth === month) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const next = { ...myStreak, lastDate: yesterday, freezeUsedMonth: month };
    setMyStreak(next);
    try {
      await sb(`users?id=eq.${myId}`, {
        method: "PATCH",
        body: { streak_last_date: yesterday, streak_freeze_used_month: month },
      });
      showToast("Congelamento usado. Sua sequência está protegida hoje.");
    } catch {
      showToast("Não consegui usar o congelamento agora.");
    }
  }

// One-time step the person sees the first time they arrive from the Hubla link.
// No password, no e-mail - just how the community should address them.
// Shown when the person arrives via the "esqueci minha senha" e-mail link.
function ResetPasswordScreen({ token, onDone }) {
  const [password, setPassword] = useState("");
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);
  const [error, setError] = useState("");

  async function handleSave() {
    if (password.trim().length < 4) {
      setError("A senha precisa ter pelo menos 4 caracteres.");
      return;
    }
    setError("");
    setSaving(true);
    const ok = await authUpdatePassword(token, password.trim());
    setSaving(false);
    if (ok) {
      setDone(true);
    } else {
      setError("Não consegui salvar a nova senha. O link pode ter expirado, peça um novo.");
    }
  }

  return (
    <div className="pc-frame" style={{ background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <style>{FRAME_CSS}</style>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 22, padding: "32px 26px", maxWidth: 380, width: "100%", fontFamily: "'Inter', sans-serif", textAlign: "center" }}>
        <p style={{ fontSize: 30, margin: "0 0 10px" }}>🕊️</p>
        {done ? (
          <>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 10px", color: T.text }}>
              Senha <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>atualizada</span>
            </h1>
            <p style={{ fontSize: 13.5, color: T.ink70, margin: "0 0 20px", lineHeight: 1.5 }}>
              Pronto! Agora é só entrar de novo com seu e-mail e a senha nova.
            </p>
            <button
              onClick={onDone}
              style={{ width: "100%", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 14.5, fontWeight: 700, background: T.gold, color: T.ink, cursor: "pointer" }}
            >
              Ir para a entrada
            </button>
          </>
        ) : (
          <>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 8px", color: T.text }}>
              Defina sua nova <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>senha</span>
            </h1>
            <p style={{ fontSize: 13, color: T.ink70, margin: "0 0 20px", lineHeight: 1.5 }}>
              Escreva a nova senha que você quer usar daqui pra frente.
            </p>
            <input
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Nova senha"
              type="password"
              style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "12px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: error ? 8 : 16, textAlign: "center" }}
            />
            {error && <p style={{ color: T.rose, fontSize: 12.5, margin: "0 0 12px" }}>{error}</p>}
            <button
              onClick={handleSave}
              disabled={saving}
              style={{ width: "100%", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 14.5, fontWeight: 700, background: T.gold, color: T.ink, cursor: saving ? "default" : "pointer", opacity: saving ? 0.7 : 1 }}
            >
              {saving ? "Salvando…" : "Salvar nova senha"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function Onboarding({ onDone }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [name, setName] = useState("");
  const [photo, setPhoto] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [recoverySent, setRecoverySent] = useState(false);

  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImage(file);
    setPhoto(dataUrl);
  }

  const emailValid = /\S+@\S+\.\S+/.test(email.trim());
  const canSubmit =
    emailValid && password.trim().length >= 4 && !saving && (mode === "login" || name.trim());

  function switchMode(next) {
    setMode(next);
    setError("");
    setRecoverySent(false);
  }

  async function handleSubmit() {
    if (!canSubmit) return;
    setError("");
    setSaving(true);
    const ok = await onDone(name.trim() || "Membro", email.trim().toLowerCase(), password, photo);
    setSaving(false);
    if (ok === false) {
      setError("Senha incorreta para esse e-mail. Tente de novo.");
    }
  }

  async function handleForgotPassword() {
    if (!emailValid) {
      setError("Digite seu e-mail acima primeiro, depois toque em \"Esqueci minha senha\".");
      return;
    }
    setError("");
    const sent = await authRecover(email.trim().toLowerCase());
    if (sent) setRecoverySent(true);
    else setError("Não consegui enviar o e-mail agora. Tente de novo em instantes.");
  }

  return (
    <div className="pc-frame" style={{ background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, overflowY: "auto" }}>
      <style>{FRAME_CSS}</style>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
      `}</style>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 22, padding: "26px 24px", maxWidth: 380, width: "100%", minHeight: 380, fontFamily: "'Inter', sans-serif", textAlign: "center", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <p style={{ fontSize: 26, margin: "0 0 6px" }}>🕊️</p>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 16px", color: T.text }}>
          Comunidade de <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>Oração</span>
        </h1>

        <div style={{ display: "flex", background: T.appBg, borderRadius: 12, padding: 4, marginBottom: 18 }}>
          <button
            onClick={() => switchMode("login")}
            style={{
              flex: 1, border: "none", borderRadius: 9, padding: "9px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
              background: mode === "login" ? T.gold : "transparent", color: mode === "login" ? T.ink : T.ink40,
            }}
          >
            Entrar
          </button>
          <button
            onClick={() => switchMode("signup")}
            style={{
              flex: 1, border: "none", borderRadius: 9, padding: "9px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
              background: mode === "signup" ? T.gold : "transparent", color: mode === "signup" ? T.ink : T.ink40,
            }}
          >
            Criar conta
          </button>
        </div>

        {mode === "signup" && (
          <>
            <p style={{ fontSize: 12.5, color: T.ink70, margin: "0 0 14px", lineHeight: 1.5 }}>
              Nos diga como podemos te chamar, seu e-mail e crie uma senha simples.
            </p>
            <label style={{ display: "inline-block", cursor: "pointer", marginBottom: 14 }}>
              <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
              {photo ? (
                <Avatar photo={photo} name={name} size={64} />
              ) : (
                <div style={{ width: 64, height: 64, borderRadius: "50%", background: T.goldSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10.5, color: T.ink, border: `1.5px dashed ${T.gold}`, margin: "0 auto", textAlign: "center", padding: 4, lineHeight: 1.2 }}>
                  Adicionar foto (opcional)
                </div>
              )}
            </label>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Seu nome"
              style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 8, textAlign: "center" }}
            />
          </>
        )}

        {mode === "login" && (
          <p style={{ fontSize: 12.5, color: T.ink70, margin: "0 0 14px", lineHeight: 1.5 }}>
            Digite seu e-mail e senha para continuar de onde parou.
          </p>
        )}

        <input
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="Seu e-mail"
          type="email"
          style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 8, textAlign: "center" }}
        />

        <input
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          placeholder={mode === "signup" ? "Crie uma senha (mín. 4 caracteres)" : "Sua senha"}
          type="password"
          style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: error ? 8 : 14, textAlign: "center" }}
        />

        {error && <p style={{ color: T.rose, fontSize: 12.5, margin: "0 0 12px" }}>{error}</p>}

        <button
          onClick={handleSubmit}
          disabled={!canSubmit}
          style={{
            width: "100%", border: "none", borderRadius: 12, padding: "11px 0", fontSize: 14.5, fontWeight: 700,
            background: canSubmit ? T.gold : T.line, color: canSubmit ? T.ink : T.ink40,
            cursor: canSubmit ? "pointer" : "not-allowed",
            boxShadow: canSubmit ? "0 8px 22px rgba(243,199,76,0.35)" : "none",
          }}
        >
          {saving ? "Entrando…" : mode === "signup" ? "Criar conta e entrar" : "Entrar na comunidade"}
        </button>

        {recoverySent ? (
          <p style={{ fontSize: 12, color: T.sage, marginTop: 10 }}>
            Te mandamos um e-mail com o link pra criar uma senha nova. Confira também a caixa de spam.
          </p>
        ) : (
          <p className="pc-link" onClick={handleForgotPassword} style={{ fontSize: 12, color: T.ink40, marginTop: 10, textDecoration: "underline" }}>
            Esqueci minha senha
          </p>
        )}
      </div>
    </div>
  );
}

function ProfileEditor({ name, email, photo, onSave }) {
  const [localName, setLocalName] = useState(name);
  const [localEmail, setLocalEmail] = useState(email || "");
  const [localPhoto, setLocalPhoto] = useState(photo);

  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImage(file);
    setLocalPhoto(dataUrl);
  }

  const canSave = localName.trim() && /\S+@\S+\.\S+/.test(localEmail.trim());

  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
        <label style={{ cursor: "pointer" }}>
          <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
          <Avatar name={localName} photo={localPhoto} size={48} fontSize={16} />
        </label>
        <span style={{ fontSize: 12, color: T.ink70 }}>Toque na foto para trocar</span>
      </div>
      <input
        value={localName}
        onChange={(e) => setLocalName(e.target.value)}
        placeholder="Seu nome"
        style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 14, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 10 }}
      />
      <input
        value={localEmail}
        onChange={(e) => setLocalEmail(e.target.value)}
        placeholder="Seu e-mail"
        type="email"
        style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 14, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 10 }}
      />
      <button
        onClick={() => canSave && onSave(localName.trim(), localEmail.trim().toLowerCase(), localPhoto)}
        disabled={!canSave}
        style={{ border: "none", background: T.ink, color: T.goldSoft, borderRadius: 10, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
      >
        Salvar
      </button>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PrayerCommunity />);
</script>
</body>
</html>
