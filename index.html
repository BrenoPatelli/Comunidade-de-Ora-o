async function sb(path, { method = "GET", body, prefer } = {}) {
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
  };
  if (prefer) headers["Prefer"] = prefer;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase ${method} ${path} failed: ${res.status} ${text}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------- Supabase Auth (real e-mail + password login, with password recovery e-mails) ----------
async function authSignIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const body = await res.json().catch(() => null);
  return { ok: res.ok, status: res.status, accessToken: body && body.access_token, refreshToken: body && body.refresh_token };
}

async function authRefreshSession(refreshToken) {
  if (!refreshToken) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) return null;
    const body = await res.json().catch(() => null);
    if (!body || !body.access_token) return null;
    return { accessToken: body.access_token, refreshToken: body.refresh_token || refreshToken };
  } catch {
    return null;
  }
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "agora mesmo";
  if (diff < 3600) return `há ${Math.max(1, Math.floor(diff / 60))} min`;
  if (diff < 86400) return `há ${Math.floor(diff / 3600)} horas`;
  return `há ${Math.floor(diff / 86400)} dias`;
}

function compressImage(file, maxSize = 320, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Uploads a compressed data-URL image to Supabase Storage (the "photos" bucket)
// instead of saving the whole image as text inside the database, and returns
// the public URL to store in a photo_url/image_url column. Falls back to
// returning the original data-URL if the upload fails, so a photo never gets lost.
// Lazily loads the NSFW-detection model once (reused for every photo after that),
// and returns false only when a photo is confidently flagged as nudity/porn —
// on any failure (model didn't load, etc.) it lets the photo through rather than
// blocking someone over a technical hiccup.
let nsfwModelPromise = null;
async function checkImageSafe(dataUrl) {
  try {
    if (!window.nsfwjs) return true;
    if (!nsfwModelPromise) nsfwModelPromise = window.nsfwjs.load();
    const model = await nsfwModelPromise;
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = dataUrl;
    });
    const predictions = await model.classify(img);
    const flagged = predictions.some(
      (p) => (p.className === "Porn" || p.className === "Hentai" || p.className === "Sexy") && p.probability > 0.6
    );
    return !flagged;
  } catch {
    return true;
  }
}

async function uploadImageToStorage(dataUrl, folder) {
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const upload = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "image/jpeg" },
      body: blob,
    });
    if (!upload.ok) return dataUrl;
    return `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
  } catch {
    return dataUrl;
  }
}

async function hashPassword(pw) {
  const text = "comunidade-oracao-salt:" + pw;
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder().encode(text);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch {
      /* fall through to the simple fallback below */
    }
  }
  // Fallback for contexts without SubtleCrypto (e.g. testing via a local file:// page).
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    hash = (hash << 5) - hash + text.charCodeAt(i);
    hash |= 0;
  }
  return "fb_" + Math.abs(hash).toString(16);
}

function normalizeForFilter(text) {
  return (text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function containsBlockedWords(text) {
  const normalized = normalizeForFilter(text);
  return BLOCKED_WORDS.some((w) => normalized.includes(normalizeForFilter(w)));
}

  async function completeOnboarding(name, email, password, photo, mode) {
    const cleanEmail = email.trim().toLowerCase();
    if (photo && photo.startsWith("data:")) {
      photo = await uploadImageToStorage(photo, "avatars");
    }
    try {
      // Recognize returning members by e-mail, even from a different app/browser
      // (Instagram, WhatsApp, Safari, etc. each have their own separate storage).
      const existing = await sb(`users?email=eq.${encodeURIComponent(cleanEmail)}&select=*&limit=1`);
      const profile = existing && existing[0];

      if (profile && profile.is_blocked) {
        setIAmBlocked(true);
        return true;
      }

      // On the "Entrar" screen, never silently create a brand-new account — if we don't
      // recognize this e-mail at all, the person almost certainly mistyped it.
      if (mode === "login" && !profile) {
        return "not_found";
      }

      // Try the real Supabase Auth sign-in first.
      const signIn = await authSignIn(cleanEmail, password);
      if (signIn.ok) {
        setMyAccessToken(signIn.accessToken || null);
        if (signIn.refreshToken) safeLocalSet("prayer_refresh_token", signIn.refreshToken);
        if (profile) {
          await logInAsProfile(profile);
          showToast(`Bem-vindo(a) de volta, ${profile.name}!`);
        } else {
          // Has an Auth account but no profile yet (shouldn't normally happen) — create one.
          const rows = await sb("users", {
            method: "POST",
            body: { name, email: cleanEmail, auth_migrated: true, photo_url: photo },
            prefer: "return=representation",
          });
          await logInAsProfile(rows[0]);
        }
        return true;
      }

      // Sign-in failed. If this profile already has a real Auth account, the password was wrong.
      if (profile && profile.auth_migrated) {
        return false; // Onboarding shows "senha incorreta"
      }

      if (mode === "login") {
        return "not_found";
      }

      // Either a brand new person, or a legacy profile made before real auth existed —
      // in both cases, register this password as their Auth account now.
      const signUp = await authSignUp(cleanEmail, password);
      if (!signUp.ok) {
        showToast("Não consegui te cadastrar agora. Tente novamente.");
        return true;
      }
      setMyAccessToken(signUp.accessToken || null);
      if (signUp.refreshToken) safeLocalSet("prayer_refresh_token", signUp.refreshToken);

      if (profile) {
        await sb(`users?id=eq.${profile.id}`, { method: "PATCH", body: { auth_migrated: true } });
        await logInAsProfile({ ...profile, auth_migrated: true });
        showToast(`Bem-vindo(a) de volta, ${profile.name}!`);
        return true;
      }

      const rows = await sb("users", {
        method: "POST",
        body: { name, email: cleanEmail, auth_migrated: true, photo_url: photo },
        prefer: "return=representation",
      });
      await logInAsProfile(rows[0]);
      return true;
    } catch (e) {
      showToast("Não consegui te cadastrar agora. Tente novamente.");
      return true;
    }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  async function bumpStreak() {
    const today = todayStr();
    if (myStreak.lastDate === today) return; // already counted today
    let nextCount = 1;
    if (myStreak.lastDate && daysBetween(myStreak.lastDate, today) === 1) {
      nextCount = myStreak.count + 1;
    }
    const next = { count: nextCount, lastDate: today, freezeUsedMonth: myStreak.freezeUsedMonth };
    setMyStreak(next);
    try {
      await sb(`users?id=eq.${myId}`, {
        method: "PATCH",
        body: { streak_count: nextCount, streak_last_date: today },
      });
    } catch {
      /* non-critical, next poll reconciles */
    }
  }

  async function useFreeze() {
    const month = todayStr().slice(0, 7);
    if (myStreak.freezeUsedMonth === month) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const next = { ...myStreak, lastDate: yesterday, freezeUsedMonth: month };
    setMyStreak(next);
    try {
      await sb(`users?id=eq.${myId}`, {
        method: "PATCH",
        body: { streak_last_date: yesterday, streak_freeze_used_month: month },
      });
      showToast("Congelamento usado. Sua sequência está protegida hoje.");
    } catch {
      showToast("Não consegui usar o congelamento agora.");
    }
  }

        await sb(`prayer_requests?id=eq.${req.id}`, { method: "PATCH", body: { is_removed: true } });
        await notifyAdmins("Um pedido foi ocultado automaticamente após várias denúncias. Confira o painel de revisão.");
        fetchRequests();
      }
      fetchReported();
    } catch {
      showToast("Não consegui registrar a denúncia agora.");
    }
  }

  async function dismissReport(requestId) {
    try {
      await sb(`prayer_requests?id=eq.${requestId}`, { method: "PATCH", body: { is_removed: false } });
      await sb(`reports?request_id=eq.${requestId}&resolved=eq.false`, { method: "PATCH", body: { resolved: true } });
      showToast("Denúncia dispensada. Conteúdo restaurado.");
      fetchRequests();
      fetchReported();
    } catch {
      showToast("Não consegui dispensar agora.");
    }
  }

  async function removeRequest(id) {
    try {
      await sb(`prayer_requests?id=eq.${id}`, { method: "PATCH", body: { is_removed: true } });
      await sb(`reports?request_id=eq.${id}&resolved=eq.false`, { method: "PATCH", body: { resolved: true } });
      fetchRequests();
      fetchReported();
    } catch {
      showToast("Não consegui remover agora.");
    }
  }

    try {
      await sb(`comments?id=eq.${commentId}`, { method: "PATCH", body: { is_removed: true } });
      fetchRequests();
    } catch {
      showToast("Não consegui remover o comentário agora.");

  }

    try {
      await sb(`users?id=eq.${userId}`, { method: "PATCH", body: { is_blocked: blocked } });
      showToast(blocked ? "Membro bloqueado." : "Membro desbloqueado.");
      fetchReported();
      setMemberResults((cur) => cur.map((u) => (u.id === userId ? { ...u, is_blocked: blocked } : u)));
    } catch {
      showToast("Não consegui atualizar esse membro agora.");
    }
  }

  async function setUserSupporter(userId, supporter) {
    try {
      const now = new Date().toISOString();
      const body = supporter ? { is_supporter: true, supporter_since: now } : { is_supporter: false };
      await sb(`users?id=eq.${userId}`, { method: "PATCH", body });
      showToast(supporter ? "Marcado(a) como apoiador(a)." : "Selo de apoiador removido.");
      setMemberResults((cur) => cur.map((u) => (u.id === userId ? { ...u, is_supporter: supporter, supporter_since: supporter ? now : null } : u)));
      setAllMembers((cur) => cur.map((u) => (u.id === userId ? { ...u, is_supporter: supporter, supporter_since: supporter ? now : null } : u)));
      if (supporter) {
        try {
          await sb("notifications", {
            method: "POST",
            body: {
              user_id: userId,
              text: "Obrigado por se tornar apoiador(a) da nossa comunidade! Sua generosidade ajuda a manter esse espaço de oração vivo para todos.",

          });
        } catch {
          /* non-critical */
        }
      }
    } catch {
      showToast("Não consegui atualizar esse membro agora.");
    }
  }

                    </div>

                  {viewedProfileQualityStats.length > 0 && (
                    <div style={{ background: T.card, borderRadius: 12, padding: 11, marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                      <p style={{ fontSize: 11.5, fontWeight: 700, color: T.text, margin: "0 0 8px" }}>Como as pessoas veem {viewedProfile.name.split(" ")[0]}</p>
                      {viewedProfileQualityStats.map((q) => {
                        const meta = QUALITIES.find((x) => x.key === q.quality);
                        return (
                          <div key={q.quality} style={{ marginBottom: 6 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: T.ink70, marginBottom: 2 }}>

                              <span style={{ fontWeight: 700, color: T.text }}>{q.percent}%</span>
                            </div>
                            <div style={{ height: 6, background: T.line, borderRadius: 3, overflow: "hidden" }}>
                              <div style={{ height: "100%", width: `${q.percent}%`, background: T.gold, borderRadius: 3 }} />

                          </div>

                  {viewedProfile.id !== myId && (

                          <button
                            key={q.key}
                            onClick={() => voteQuality(viewedProfile.id, q.key)}
                            style={{ border: `1px solid ${T.line}`, background: T.card, borderRadius: 16, padding: "5px 10px", fontSize: 11, color: T.text, cursor: "pointer" }}

                            {q.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <p style={{ fontSize: 13, fontWeight: 800, color: T.text, margin: "0 0 8px" }}>Pedidos de oração</p>
                  {viewedProfileTestimonies.length === 0 ? (
                    <p style={{ textAlign: "center", color: T.ink40, fontSize: 12.5, marginTop: 16 }}>Ainda não publicou nenhum pedido de oração.</p>
                  ) : (
                    viewedProfileTestimonies.map((t) => (
                      <div key={t.id} style={{ background: T.card, borderRadius: 11, padding: "10px 12px", marginBottom: 6, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                        <p style={{ fontSize: 12.5, lineHeight: 1.45, color: T.text, margin: "0 0 3px" }}>{t.text}</p>
                        <span style={{ fontSize: 10.5, color: T.ink40 }}>{t.time}</span>
                      </div>
                    ))
                  )}
                </>
              )}
            </>
          )}

          {tab === "postDetail" && postDetail && (
            <>
              {(() => {
                const isTestimony = postDetail.type === "testimony";
                const post = isTestimony
                  ? testimonies.find((t) => t.id === postDetail.id)
                  : requests.find((r) => r.id === postDetail.id);
                if (!post) {
                  return <p style={{ textAlign: "center", color: T.ink40, marginTop: 30 }}>Publicação não encontrada.</p>;
                }
                const comments = post.comments || [];
                const draft = isTestimony ? testimonyCommentDraft[post.id] || "" : commentDraft[post.id] || "";
                const onChange = isTestimony
                  ? (v) => setTestimonyCommentDraft((d) => ({ ...d, [post.id]: v }))
                  : (v) => setCommentDraft((d) => ({ ...d, [post.id]: v }));
                const onSend = isTestimony ? () => sendTestimonyComment(post) : () => sendComment(post);
                const onRemoveC = isTestimony ? removeTestimonyComment : removeComment;
                const displayName = post.anonymous ? "Anônimo(a)" : post.authorName;
                return (
                  <>
                    <div style={{ background: T.card, borderRadius: 16, padding: "13px 14px", marginBottom: 14, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                        <div style={{ width: 32, height: 32, borderRadius: "50%", background: T.mute, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, color: T.ink70, fontSize: 13 }}>
                          {post.anonymous ? "?" : initials(post.authorName)}
                        </div>
                        <div>
                          <p style={{ margin: 0, fontSize: 13.5, fontWeight: 700, color: T.text }}>{displayName}</p>
                          <span style={{ fontSize: 11, color: T.ink40 }}>{post.time}</span>
                        </div>
                      </div>
                      <p style={{ fontSize: 17, lineHeight: 1.55, color: T.text, margin: 0 }}>{post.text}</p>
                    </div>

                    <p style={{ fontSize: 13, fontWeight: 800, color: T.text, margin: "0 0 10px" }}>
                      {comments.length === 0 ? "Nenhum comentário ainda" : `${comments.length} coment${comments.length === 1 ? "ário" : "ários"}`}
                    </p>

                    {comments.map((c) => (
                      <div key={c.id} style={{ background: T.card, borderRadius: 12, padding: "10px 12px", marginBottom: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>

                          <p style={{ margin: 0, fontSize: 13 }}>
                            <strong>{c.authorName}</strong>
                            {c.authorIsSupporter && <SupporterBadge size={11} />}
                            <strong>: </strong>
                            <span style={{ color: T.ink70 }}>{c.text}</span>
                          </p>
                          {isAdmin && (
                            <span
                              className="pc-link"
                              onClick={() => {
                                if (window.confirm("Remover este comentário para todos?")) onRemoveC(c.id);

                              style={{ color: T.rose, flexShrink: 0 }}

                              <IconTrash2 size={13} />
                            </span>
                          )}

                      </div>
                    ))}

                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <input
                        value={draft}
                        onChange={(e) => onChange(e.target.value)}

                        onClick={onSend}

                  </>

            </>

                      width: "100%", border: "none", borderRadius: 10, padding: "10px 0", fontSize: 13, fontWeight: 700,

                </div>
              )}

              <input

              {(() => {
                const q = communitySearchQuery.trim().toLowerCase();
                const filtered = q ? communities.filter((c) => c.name.toLowerCase().includes(q)) : communities;
                if (communities.length === 0) {
                  return (
                    <p style={{ textAlign: "center", color: T.ink40, fontSize: 13.5, marginTop: 30 }}>

                    </p>
                  );
                }
                if (filtered.length === 0) {
                  return (
                    <p style={{ textAlign: "center", color: T.ink40, fontSize: 13.5, marginTop: 30 }}>

                    </p>

                return filtered.map((c) => {

                  return (
                    <div
                      key={c.id}
                      className="pc-link"
                      onClick={() => openCommunityChat(c)}

                        display: "flex", alignItems: "center", gap: 12, background: T.card, borderRadius: 14,

                      }}
                    >
                      {c.image ? (
                        <img src={c.image} alt="" style={{ width: 44, height: 44, borderRadius: 12, objectFit: "cover", flexShrink: 0 }} />

                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ margin: 0, fontSize: 14, fontWeight: 700, color: T.text }}>{c.name}</p>
                        <span style={{ fontSize: 11.5, color: T.ink40 }}>
                          {c.followerCount} {c.followerCount === 1 ? "seguidor" : "seguidores"}

                      </div>
                      <button
                        onClick={(e) => { e.stopPropagation(); toggleCommunityFollow(c.id); }}
                        style={{
                          border: "none", borderRadius: 20, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                          background: isFollowing ? T.mute : T.ink,
                          color: isFollowing ? T.text : "#fff",
                          flexShrink: 0,
                        }}
                      >
                        {isFollowing ? "Seguindo" : "Seguir"}
                      </button>
                      {isAdmin && (
                        <span
                          className="pc-link"
                          onClick={(e) => {
                            e.stopPropagation();
                            if (window.confirm(`Excluir a comunidade "${c.name}" para todos?`)) removeCommunity(c.id);
                          }}
                          title="Excluir comunidade (admin)"
                          style={{ color: T.rose, display: "flex", alignItems: "center", flexShrink: 0 }}
                        >
                          <IconTrash2 size={16} />
                        </span>
                      )}
                    </div>
                  );
                });
              })()}
            </>
          )}

          {tab === "communityDetail" && openCommunity && (
            <>
              {(() => {
                const following = myCommunityFollows.has(openCommunity.id);
                return (
                  <>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                      {openCommunity.image ? (
                        <img src={openCommunity.image} alt="" style={{ width: 48, height: 48, borderRadius: 12, objectFit: "cover" }} />
                      ) : (
                        <div style={{ width: 48, height: 48, borderRadius: 12, background: T.mute, display: "flex", alignItems: "center", justifyContent: "center", color: T.ink70, fontWeight: 700, fontSize: 18 }}>
                          {openCommunity.name.charAt(0).toUpperCase()}
                        </div>
                      )}
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ margin: 0, fontSize: 16, fontWeight: 800, color: T.text }}>{openCommunity.name}</p>
                        <span style={{ fontSize: 11.5, color: T.ink40 }}>{openCommunity.followerCount} seguidores</span>
                      </div>
                      <button
                        onClick={() => toggleCommunityFollow(openCommunity.id)}
                        style={{
                          border: "none", borderRadius: 20, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                          background: following ? T.mute : T.ink, color: following ? T.text : "#fff", flexShrink: 0,
                        }}
                      >
                        {following ? "Seguindo" : "Seguir"}
                      </button>
                    </div>

                    {communityMessages.length === 0 ? (
                      <p style={{ textAlign: "center", color: T.ink40, fontSize: 13.5, marginTop: 30 }}>
                        Ainda não tem nenhuma mensagem aqui. Seja o primeiro a puxar assunto!
                      </p>
                    ) : (
                      communityMessages.map((m) => (
                        <div key={m.id} style={{ background: T.card, borderRadius: 12, padding: "10px 12px", marginBottom: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                            <p style={{ margin: 0, fontSize: 13.5 }}>
                              <strong style={{ color: T.text }}>{m.authorName}</strong>
                              {m.authorIsSupporter && <SupporterBadge size={11} />}
                              <span style={{ color: T.ink70 }}>: {m.text}</span>
                            </p>
                            {isAdmin && (
                              <span
                                className="pc-link"
                                onClick={() => { if (window.confirm("Remover esta mensagem para todos?")) removeCommunityMessage(m.id); }}
                                style={{ color: T.rose, flexShrink: 0 }}
                              >
                                <IconTrash2 size={13} />
                              </span>
                            )}
                          </div>
                          <span style={{ fontSize: 10.5, color: T.ink40 }}>{m.time}</span>
                        </div>
                      ))
                    )}

                    {following ? (
                      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                        <input
                          value={communityMessageDraft}
                          onChange={(e) => setCommunityMessageDraft(e.target.value.slice(0, POST_MAX_LENGTH))}
                          onKeyDown={(e) => e.key === "Enter" && sendCommunityMessage()}
                          placeholder="Escreva uma mensagem..."
                          maxLength={POST_MAX_LENGTH}
                          style={{ flex: 1, border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 12px", fontSize: 13.5, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text }}
                        />
                        <button
                          onClick={sendCommunityMessage}
                          style={{ border: "none", background: T.ink, color: T.goldSoft, borderRadius: 10, padding: "0 16px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
                        >
                          Enviar
                        </button>
                      </div>
                    ) : (
                      <p style={{ textAlign: "center", fontSize: 12.5, color: T.ink40, marginTop: 12 }}>
                        Siga esta comunidade para participar da conversa.
                      </p>
                    )}
                  </>
                );
              })()}
            </>
          )}

          {tab === "support" && (
            <>
              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ display: "flex", justifyContent: "center", margin: "8px 0 10px" }}><DoveIcon size={36} color={T.gold} /></div>
                <h2 className="pc-serif" style={{ fontSize: 20, margin: "0 0 8px", color: T.text }}>
                  Ajude essa <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>comunidade</span> a crescer
                </h2>
                <p style={{ fontSize: 13.5, color: T.ink70, lineHeight: 1.6, maxWidth: 320, margin: "0 auto" }}>
                  A comunidade continua grátis pra todo mundo, sempre. Se ela tem feito diferença na sua caminhada de fé,
                  você pode apoiar com R$10/mês e ainda ganhar alguns mimos especiais.
                </p>
              </div>

              <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, padding: 18, marginBottom: 20 }}>
                {[
                  [<SupporterBadge size={16} />, "Selo dourado de apoiador(a) ao lado do seu nome"],
                  [<IconPin size={16} color={T.text} />, "Destaque seu pedido no topo do mural por 24h"],
                  [<IconEye size={16} color={T.text} />, "Veja exatamente quem orou por você"],
                  [<IconBook size={16} color={T.text} />, "Histórico completo de todos os seus pedidos"],
                  [<IconFlame size={16} color={T.text} />, "Proteja sua sequência de oração com congelamento mensal"],
                ].map(([icon, label], i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: i === 4 ? 0 : 12 }}>
                    <span style={{ flexShrink: 0, display: "flex" }}>{icon}</span>
                    <span style={{ fontSize: 13.5, color: T.text }}>{label}</span>
                  </div>
                ))}
              </div>

              {myIsSupporter ? (
                <div style={{ textAlign: "center", background: T.sageSoft, border: `1px solid ${T.sage}`, borderRadius: 14, padding: 16 }}>
                  <p style={{ margin: 0, fontSize: 14, color: T.sage, fontWeight: 600 }}>
                    Você já é apoiador(a). Obrigado por sustentar essa comunidade!
                  </p>
                </div>
              ) : (
                <a
                  href={SUPPORTER_SIGNUP_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{
                    display: "block", textAlign: "center", textDecoration: "none",
                    width: "100%", border: "none", borderRadius: 12, padding: "14px 0",
                    fontSize: 15, fontWeight: 700, letterSpacing: 0.2,
                    background: T.gold, color: T.ink,
                    boxShadow: "0 8px 22px rgba(243,199,76,0.35)",
                  }}
                >
                  Quero ser apoiador(a) por R$10/mês
                </a>
              )}
              <p style={{ textAlign: "center", fontSize: 11.5, color: T.ink40, marginTop: 10 }}>
                Você será redirecionado(a) para concluir sua contribuição.
              </p>
            </>
          )}
        </div>

        {showScrollTop && (
          <button
            onClick={scrollToTop}
            aria-label="Voltar ao topo"
            style={{
              position: "absolute",
              right: 16,
              bottom: 96,
              width: 40,
              height: 40,
              borderRadius: "50%",
              border: "none",
              background: T.card,
              color: T.purple,
              boxShadow: "0 4px 14px rgba(42,33,80,0.25)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              fontSize: 18,
              cursor: "pointer",
              zIndex: 6,
            }}
          >
            ↑
          </button>
        )}

        {/* Bottom nav */}
        <div
          style={{
            position: "absolute",
            bottom: 16,
            left: 16,
            right: 16,
            background: "rgba(255,255,255,0.72)",
            backdropFilter: "blur(20px) saturate(1.6)",
            WebkitBackdropFilter: "blur(20px) saturate(1.6)",
            border: "1px solid rgba(255,255,255,0.6)",
            borderRadius: 30,
            display: "flex",
            justifyContent: "space-around",
            padding: "10px 6px",
            boxShadow: "0 8px 28px rgba(0,0,0,0.14)",
          }}
        >
          <TabButton icon={IconHome} label="Início" active={tab === "home"} onClick={() => setTab("home")} />
          <TabButton
            icon={IconTarget}
            label="Campanhas"
            active={tab === "campaigns" || tab === "campaignDetail"}
            onClick={() => {
              setTab("campaigns");
              fetchCampaigns();
              fetchMySubscriptions(myId);
            }}
          />
          <TabButton
            icon={IconUsers}
            label="Comunidades"
            active={tab === "communities"}
            onClick={() => {
              setTab("communities");
              fetchCommunities();
            }}
          />
          <TabButton icon={IconUser} label="Perfil" active={tab === "profile"} onClick={() => setTab("profile")} />
        </div>

        {/* Names modal */}
        {namesModal !== null && (
          <NamesModal
            request={requests.find((r) => r.id === namesModal)}
            onClose={() => setNamesModal(null)}
            canSeeNames={myIsSupporter || isAdmin}
          />
        )}

        {/* Toast */}
        {toast && (
          <div
            className="pc-toast"
            style={{
              position: "absolute",
              bottom: 78,
              left: "50%",
              transform: "translateX(-50%)",
              background: T.ink,
              color: T.goldSoft,
              padding: "10px 16px",
              borderRadius: 20,
              fontSize: 13,
              boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
              whiteSpace: "nowrap",
              zIndex: 20,
            }}
          >
            {toast}
          </div>
        )}
      </div>
    </div>
  );
}

function TabButton({ icon: Icon, label, active, onClick, badge }) {
  return (
    <button
      className="pc-tab"
      onClick={onClick}
      style={{
        background: "none",
        border: "none",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: 4,
        cursor: "pointer",
        color: active ? T.purple : T.ink40,
        position: "relative",
        padding: "2px 6px",
      }}
    >
      <Icon size={20} strokeWidth={active ? 2.4 : 1.9} color={active ? T.purple : T.ink40} />
      <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{label}</span>
      {!!badge && (
        <span
          style={{
            position: "absolute",
            top: -2,
            right: -6,
            background: T.rose,
            color: "#fff",
            fontSize: 9,
            borderRadius: 8,
            padding: "1px 5px",
            fontWeight: 700,
          }}
        >
          {badge}
        </span>
      )}
    </button>
  );
}

function StatCard({ label, value }) {
  return (
    <div style={{ flex: 1, background: T.card, border: `1px solid ${T.line}`, borderRadius: 14, padding: "14px 12px", textAlign: "center" }}>
      <p className="pc-serif" style={{ margin: 0, fontSize: 24, fontWeight: 600, color: T.text }}>{value}</p>
      <p style={{ margin: "4px 0 0", fontSize: 11.5, color: T.ink70 }}>{label}</p>
    </div>
  );
}

function RequestCard({ r, onPray, onShowNames, onToggleComments, commentsOpen, commentDraft, onCommentChange, onSendComment, onReport, mine, myName, myPhoto, myId, isAdmin, onRemove, onRemoveComment }) {

// One-time step the person sees the first time they arrive from the Hubla link.
// No password, no e-mail - just how the community should address them.
// Shown when the person arrives via the "esqueci minha senha" e-mail link.
function ResetPasswordScreen({ token, onDone }) {
  const [password, setPassword] = useState("");
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);
  const [error, setError] = useState("");

  async function handleSave() {
    if (password.trim().length < 6) {
      setError("A senha precisa ter pelo menos 6 caracteres.");
      return;
    }
    setError("");
    setSaving(true);
    const ok = await authUpdatePassword(token, password.trim());
    setSaving(false);
    if (ok) {
      setDone(true);
    } else {
      setError("Não consegui salvar a nova senha. O link pode ter expirado, peça um novo.");
    }
  }

  return (
    <div className="pc-frame" style={{ background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <style>{FRAME_CSS}</style>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 22, padding: "32px 26px", maxWidth: 380, width: "100%", fontFamily: "'Inter', sans-serif", textAlign: "center" }}>
        <div style={{ display: "flex", justifyContent: "center", margin: "0 0 10px" }}><DoveIcon size={30} color={T.text} /></div>
        {done ? (
          <>
            <h1 style={{ fontFamily: "'Inter', sans-serif", fontWeight: 800, fontSize: 20, margin: "0 0 10px", color: T.text }}>
              Senha <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>atualizada</span>
            </h1>
            <p style={{ fontSize: 13.5, color: T.ink70, margin: "0 0 20px", lineHeight: 1.5 }}>
              Pronto! Agora é só entrar de novo com seu e-mail e a senha nova.
            </p>
            <button
              onClick={onDone}
              style={{ width: "100%", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 14.5, fontWeight: 700, background: T.gold, color: T.ink, cursor: "pointer" }}
            >
              Ir para a entrada
            </button>
          </>
        ) : (
          <>
            <h1 style={{ fontFamily: "'Inter', sans-serif", fontWeight: 800, fontSize: 20, margin: "0 0 8px", color: T.text }}>
              Defina sua nova <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>senha</span>
            </h1>
            <p style={{ fontSize: 13, color: T.ink70, margin: "0 0 20px", lineHeight: 1.5 }}>
              Escreva a nova senha que você quer usar daqui pra frente.
            </p>
            <input
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Nova senha"
              type="password"
              style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "12px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: error ? 8 : 16, textAlign: "center" }}
            />
            {error && <p style={{ color: T.rose, fontSize: 12.5, margin: "0 0 12px" }}>{error}</p>}
            <button
              onClick={handleSave}
              disabled={saving}
              style={{ width: "100%", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 14.5, fontWeight: 700, background: T.gold, color: T.ink, cursor: saving ? "default" : "pointer", opacity: saving ? 0.7 : 1 }}
            >
              {saving ? "Salvando…" : "Salvar nova senha"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

          <p style={{ fontWeight: 700, marginTop: 14, marginBottom: 6 }}>13. Contato</p>

        </div>

        <button
          onClick={onClose}
          style={{ width: "100%", marginTop: 20, border: "none", borderRadius: 12, padding: "12px 0", fontSize: 14, fontWeight: 700, background: "#17171A", color: "#fff", cursor: "pointer" }}
        >
          Fechar
        </button>
      </div>
    </div>
  );
}

function Onboarding({ onDone, showToast }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [name, setName] = useState("");
  const [photo, setPhoto] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [recoverySent, setRecoverySent] = useState(false);
  const [agreedToTerms, setAgreedToTerms] = useState(false);
  const [showTerms, setShowTerms] = useState(false);

  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImage(file);
    const safe = await checkImageSafe(dataUrl);
    if (!safe) {
      showToast("Essa imagem não pode ser usada. Escolha outra foto.");
      return;
    }
    setPhoto(dataUrl);
  }

  const emailValid = /\S+@\S+\.\S+/.test(email.trim());
  const canSubmit =
    emailValid && password.trim().length >= 6 && !saving && (mode === "login" || (name.trim() && agreedToTerms));

  function switchMode(next) {
    setMode(next);
    setError("");
    setRecoverySent(false);
  }

  async function handleSubmit() {
    if (!canSubmit) return;
    setError("");
    setSaving(true);
    const ok = await onDone(name.trim() || "Membro", email.trim().toLowerCase(), password, photo, mode);
    setSaving(false);
    if (ok === false) {
      setError("Senha incorreta para esse e-mail. Tente de novo.");
    } else if (ok === "not_found") {
      setError("Não encontramos nenhuma conta com esse e-mail. Confira se digitou certo, ou toque em \"Criar conta\" para se cadastrar.");
    }
  }

  async function handleForgotPassword() {
    if (!emailValid) {
      setError("Digite seu e-mail acima primeiro, depois toque em \"Esqueci minha senha\".");
      return;
    }
    setError("");
    const sent = await authRecover(email.trim().toLowerCase());
    if (sent) setRecoverySent(true);
    else setError("Não consegui enviar o e-mail agora. Tente de novo em instantes.");
  }

  return (
    <div className="pc-frame" style={{ background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, overflowY: "auto" }}>
      <style>{FRAME_CSS}</style>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; }
      `}</style>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 22, padding: "26px 24px", maxWidth: 380, width: "100%", minHeight: 380, fontFamily: "'Inter', sans-serif", textAlign: "center", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <div style={{ display: "flex", justifyContent: "center", margin: "0 0 10px" }}><img src={LOGO_ICON} alt="Oremos" style={{ width: 64, height: 64 }} /></div>
        <h1 style={{ fontFamily: "'Inter', sans-serif", fontWeight: 800, fontSize: 20, margin: "0 0 16px", color: T.text }}>
          Comunidade de <span style={{ color: T.goldDeep, fontStyle: "italic", fontWeight: 700 }}>Oração</span>
        </h1>

        <div style={{ display: "flex", background: T.appBg, borderRadius: 12, padding: 4, marginBottom: 18 }}>
          <button
            onClick={() => switchMode("login")}
            style={{
              flex: 1, border: "none", borderRadius: 9, padding: "9px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
              background: mode === "login" ? T.gold : "transparent", color: mode === "login" ? T.ink : T.ink40,
            }}
          >
            Entrar
          </button>
          <button
            onClick={() => switchMode("signup")}
            style={{
              flex: 1, border: "none", borderRadius: 9, padding: "9px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
              background: mode === "signup" ? T.gold : "transparent", color: mode === "signup" ? T.ink : T.ink40,
            }}
          >
            Criar conta
          </button>
        </div>

        {mode === "signup" && (
          <>
            <p style={{ fontSize: 12.5, color: T.ink70, margin: "0 0 14px", lineHeight: 1.5 }}>
              Nos diga como podemos te chamar, seu e-mail e crie uma senha simples.
            </p>
            <label style={{ display: "inline-block", cursor: "pointer", marginBottom: 14 }}>
              <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
              {photo ? (
                <Avatar photo={photo} name={name} size={64} />
              ) : (
                <div style={{ width: 64, height: 64, borderRadius: "50%", background: T.goldSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10.5, color: T.ink, border: `1.5px dashed ${T.gold}`, margin: "0 auto", textAlign: "center", padding: 4, lineHeight: 1.2 }}>
                  Adicionar foto (opcional)
                </div>
              )}
            </label>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Seu nome"
              style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 8, textAlign: "center" }}
            />
          </>
        )}

        {mode === "login" && (
          <p style={{ fontSize: 12.5, color: T.ink70, margin: "0 0 14px", lineHeight: 1.5 }}>
            Digite seu e-mail e senha para continuar de onde parou.
          </p>
        )}

        <input
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="Seu e-mail"
          type="email"
          style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 8, textAlign: "center" }}
        />

        <input
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          placeholder={mode === "signup" ? "Crie uma senha (mín. 6 caracteres)" : "Sua senha"}
          type="password"
          style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: error ? 8 : 14, textAlign: "center" }}
        />

        {error && <p style={{ color: T.rose, fontSize: 12.5, margin: "0 0 12px" }}>{error}</p>}

        {mode === "signup" && (
          <label style={{ display: "flex", alignItems: "flex-start", gap: 8, textAlign: "left", marginBottom: 14, cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={agreedToTerms}
              onChange={(e) => setAgreedToTerms(e.target.checked)}
              style={{ marginTop: 2, width: 16, height: 16, accentColor: T.gold, flexShrink: 0 }}
            />
            <span style={{ fontSize: 12, color: T.ink70, lineHeight: 1.4 }}>
              Li e concordo com os{" "}
              <span className="pc-link" onClick={(e) => { e.preventDefault(); setShowTerms(true); }} style={{ color: T.goldDeep, textDecoration: "underline", fontWeight: 600 }}>
                Termos de Uso e Política de Privacidade
              </span>
            </span>
          </label>
        )}

        <button
          onClick={handleSubmit}
          disabled={!canSubmit}
          style={{
            width: "100%", border: "none", borderRadius: 12, padding: "11px 0", fontSize: 14.5, fontWeight: 700,
            background: canSubmit ? T.gold : T.line, color: canSubmit ? T.ink : T.ink40,
            cursor: canSubmit ? "pointer" : "not-allowed",
            boxShadow: canSubmit ? "0 8px 22px rgba(243,199,76,0.35)" : "none",
          }}
        >
          {saving ? "Entrando…" : mode === "signup" ? "Criar conta e entrar" : "Entrar na comunidade"}
        </button>

        {showTerms && <TermsModal onClose={() => setShowTerms(false)} />}

        {recoverySent ? (
          <p style={{ fontSize: 12, color: T.sage, marginTop: 10 }}>
            Te mandamos um e-mail com o link pra criar uma senha nova. Confira também a caixa de spam.
          </p>
        ) : (
          <p className="pc-link" onClick={handleForgotPassword} style={{ fontSize: 12, color: T.ink40, marginTop: 10, textDecoration: "underline" }}>
            Esqueci minha senha
          </p>
        )}
      </div>
    </div>
  );
}

function ProfileEditor({ name, email, photo, onSave, showToast }) {
  const [localName, setLocalName] = useState(name);
  const [localEmail, setLocalEmail] = useState(email || "");
  const [localPhoto, setLocalPhoto] = useState(photo);

  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImage(file);
    const safe = await checkImageSafe(dataUrl);
    if (!safe) {
      showToast("Essa imagem não pode ser usada. Escolha outra foto.");
      return;
    }
    setLocalPhoto(dataUrl);
  }

  const canSave = localName.trim() && /\S+@\S+\.\S+/.test(localEmail.trim());

  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
        <label style={{ cursor: "pointer" }}>
          <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
          <Avatar name={localName} photo={localPhoto} size={48} fontSize={16} />
        </label>
        <span style={{ fontSize: 12, color: T.ink70 }}>Toque na foto para trocar</span>
      </div>
      <input
        value={localName}
        onChange={(e) => setLocalName(e.target.value)}
        placeholder="Seu nome"
        style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 14, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 10 }}
      />
      <input
        value={localEmail}
        onChange={(e) => setLocalEmail(e.target.value)}
        placeholder="Seu e-mail"
        type="email"
        style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 14, outline: "none", fontFamily: "inherit", background: T.appBg, color: T.text, marginBottom: 10 }}
      />
      <button
        onClick={() => canSave && onSave(localName.trim(), localEmail.trim().toLowerCase(), localPhoto)}
        disabled={!canSave}
        style={{ border: "none", background: T.ink, color: T.goldSoft, borderRadius: 10, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
      >
        Salvar
      </button>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PrayerCommunity />);
</script>
